<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GW Manager</title>
<style>
:root{--bg:#0f1218;--card:#181d27;--bd:#2a3140;--tx:#d8dee9;--mut:#8792a6;--ac:#4fa3ff;--ok:#3ecf8e;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:0;flex-wrap:wrap}
header b{margin-right:16px}nav button{background:none;border:0;color:var(--mut);padding:14px 12px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
nav button.on{color:var(--tx);border-color:var(--ac)}main{max-width:1000px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:16px}h3{margin:0 0 10px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-weight:500}
input,select,textarea{background:#0f131b;border:1px solid var(--bd);color:var(--tx);border-radius:5px;padding:6px 8px;font:inherit;max-width:100%}
td input:not([type=checkbox]){width:100%}input[type=checkbox]{width:auto}textarea{width:100%;min-height:110px;font-family:monospace}
button.b{background:var(--ac);color:#04121f;border:0;border-radius:5px;padding:7px 14px;cursor:pointer;font:inherit;margin:4px 4px 0 0}
button.g{background:#2a3140;color:var(--tx)}button.d{background:#5a2530;color:#ffb3b3}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}label{display:block;margin:8px 0 3px;color:var(--mut)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:170px}.row input,.row select{width:100%}
h2{margin:0 0 4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;overflow:hidden}.tl{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tv{font-size:26px;font-weight:600;margin:2px 0 8px}.tv small{font-size:13px;color:var(--mut);font-weight:400}.bar{height:7px;background:#0f131b;border-radius:4px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:4px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#0f131b;border:1px solid var(--bd);border-radius:20px;padding:5px 12px;margin:0 8px 8px 0}.dot{width:8px;height:8px;border-radius:50%}
.leg{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap;margin:4px 0 8px}.leg b{font-size:20px}.leg span{color:var(--mut);font-size:12px}
#msg{position:fixed;bottom:16px;right:16px;padding:10px 14px;border-radius:6px;background:#222b3a;display:none;max-width:420px}
</style></head><body>
<header><b>GW Manager</b><nav id="nav"></nav></header><main id="main"></main><div id="msg"></div>
<script>
const $=s=>document.querySelector(s),V=id=>document.getElementById(id);let C,S,M,dIf='',tab='dash';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function msg(t,bad){const m=$('#msg');m.textContent=t;m.style.color=bad?'var(--bad)':'var(--ok)';m.style.display='block';setTimeout(()=>m.style.display='none',5000)}
async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json','X-Requested-With':'gw'},body:b?JSON.stringify(b):undefined});
 const t=await r.text();let j;try{j=JSON.parse(t)}catch{j=t}if(r.status==401){login();throw 0}if(!r.ok)throw new Error(j.error||t);return j}
async function put(part){try{const r=await api('config','PUT',part);msg(r.errors.length?r.errors.join(' | '):'Applied',r.errors.length);await load()}catch(e){if(e)msg(e.message,1)}}
function login(){$('#nav').innerHTML='';$('#main').innerHTML=`<div class=card style="max-width:340px;margin:60px auto"><h3>Sign in</h3><input id=pw type=password placeholder=password style="width:100%" onkeydown="if(event.key=='Enter')doLogin()"><button class=b onclick=doLogin()>Sign in</button></div>`}
async function doLogin(){try{await api('login','POST',{password:V('pw').value});load()}catch(e){if(e)msg(e.message,1)}}
const f=(id,l,v,t='text',ph='')=>`<div><label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}" placeholder="${ph}"></div>`;
const chk=(id,l,v)=>`<div><label><input id="${id}" type=checkbox ${v?'checked':''}> ${l}</label></div>`;
const tabs={dash:['Dashboard',rDash],status:['Status',rStatus],routing:['Routing',rRouting],vpnc:['VPNs & proxies',rVpnc],vpns:['VPN servers',rVpns],set:['Settings',rSet]};
function draw(){$('#nav').innerHTML=Object.entries(tabs).map(([k,[n]])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';draw()">${n}</button>`).join('');$('#main').innerHTML=tabs[tab][1]()}
async function load(){try{[C,S]=await Promise.all([api('config'),api('status')]);draw()}catch(e){}}
const bits=v=>{v*=8;return v>=1e6?(v/1e6).toFixed(1)+' Mbit/s':v>=1e3?(v/1e3).toFixed(0)+' kbit/s':Math.round(v)+' bit/s'};
const gb=b=>(b/1073741824).toFixed(1)+' GB',dur=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+h+'h '+m+'m'};
const bytes=b=>b>=1e9?(b/1e9).toFixed(2)+' GB':b>=1e6?(b/1e6).toFixed(1)+' MB':(b/1e3).toFixed(0)+' kB';
function chart(id,series,{h=70,max}={}){const W=600,n=Math.max(2,...series.map(s=>s.d.length)),mx=max||Math.max(1,...series.flatMap(s=>s.d))*1.1,
 y=v=>h-3-v/mx*(h-8),x=i=>i/(n-1)*W;
 const defs=series.map((s,k)=>`<linearGradient id="${id}${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".45"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient>`).join('');
 const grid=[.25,.5,.75].map(f=>`<line x1=0 x2=${W} y1=${h*f} y2=${h*f} stroke="#2a3140" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>`).join('');
 const paths=series.map((s,k)=>{if(s.d.length<2)return'';const o=n-s.d.length,pts=s.d.map((v,i)=>`${x(i+o).toFixed(1)},${y(v).toFixed(1)}`),l='M'+pts.join(' L');
  return`<path d="${l} L${W},${h} L${x(o)},${h} Z" fill="url(#${id}${k})"/><path d="${l}" fill="none" stroke="${s.c}" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`}).join('');
 return`<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block"><defs>${defs}</defs>${grid}${paths}</svg>`}
function rDash(){setTimeout(loadM,0);return`<div id=dash>${M?dashHtml():'<p class=mut>Loading…</p>'}</div>`}
async function loadM(){try{M=await api('metrics');const el=V('dash');if(tab=='dash'&&el)el.innerHTML=dashHtml()}catch(e){}}
function dashHtml(){const H=M.hist,L=H[H.length-1]||{cpu:0,mem:0},ifs=Object.keys(M.totals);
 if(!ifs.includes(dIf))dIf=ifs.find(i=>!/^(ovpn|l2tp|px|ppp|tun)/.test(i))||ifs[0]||'';
 const rx=H.map(s=>(s.net[dIf]||[0,0])[0]),tx=H.map(s=>(s.net[dIf]||[0,0])[1]),tot=M.totals[dIf]||[0,0];
 const memP=100*M.mem_used/M.mem_total,dskP=100*M.disk_used/M.disk_total,col=p=>p>85?'var(--bad)':p>65?'#f5a623':'var(--ok)';
 const tc=M.temp==null?'':M.temp>75?'var(--bad)':M.temp>60?'#f5a623':'var(--ok)';
 const act=(S.routes||[]).filter(r=>r=='active').length;
 return`${S.errors&&S.errors.length?`<div class=card><h3 class=bad>Errors</h3>${S.errors.map(e=>`<pre>${esc(e)}</pre>`).join('')}</div>`:''}
<p class=mut style="margin-top:0"><b style="color:var(--tx)">${esc(M.hostname)}</b> · up ${dur(M.uptime)} · load ${M.load.map(v=>v.toFixed(2)).join(' ')}</p>
<div class=grid>
<div class=tile><div class=tl>CPU</div><div class=tv style="color:${col(L.cpu)}">${L.cpu.toFixed(0)}%<small> ${M.cores} cores</small></div>${chart('cpu',[{d:H.map(s=>s.cpu),c:'#4fa3ff'}],{max:100})}</div>
<div class=tile><div class=tl>Memory</div><div class=tv style="color:${col(memP)}">${memP.toFixed(0)}%<small> ${gb(M.mem_used)} / ${gb(M.mem_total)}</small></div>${chart('mem',[{d:H.map(s=>s.mem),c:'#b48cff'}],{max:100})}</div>
<div class=tile><div class=tl>Temperature</div><div class=tv style="color:${tc}">${M.temp==null?'n/a':M.temp.toFixed(0)+'°C'}</div><div class=tl>Disk /</div><div class=tv style="font-size:18px;margin:2px 0">${gb(M.disk_used)}<small> / ${gb(M.disk_total)}</small></div><div class=bar><i style="width:${dskP}%;background:${col(dskP)}"></i></div></div>
<div class=tile><div class=tl>Tunnels &amp; routes</div><div style="margin-top:10px">${S.vpn.map(v=>`<span class=chip><span class=dot style="background:${v.up?'var(--ok)':'var(--bad)'}"></span>${esc(v.name)}</span>`).join('')||'<span class=mut>no tunnels configured</span>'}</div><div class=mut>${act} of ${(S.routes||[]).length} routing rules active</div></div>
</div>
<div class=card><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h3 style="margin:0">Traffic</h3>
<select onchange="dIf=this.value;loadM()">${ifs.map(i=>`<option ${i==dIf?'selected':''}>${esc(i)}</option>`).join('')}</select></div>
<div class=leg><div><b style="color:#3ecf8e">↓ ${bits(rx[rx.length-1]||0)}</b> <span>peak ${bits(Math.max(0,...rx))} · total ${bytes(tot[0])}</span></div>
<div><b style="color:#4fa3ff">↑ ${bits(tx[tx.length-1]||0)}</b> <span>peak ${bits(Math.max(0,...tx))} · total ${bytes(tot[1])}</span></div><span>last ${Math.round(H.length*5/60)} min · totals since boot</span></div>
${chart('net',[{d:rx,c:'#3ecf8e'},{d:tx,c:'#4fa3ff'}],{h:150})}</div>`}
const st=x=>x?'<span class=ok>up</span>':'<span class=bad>down</span>';

function rStatus(){return `${S.tun===false?`<div class=card><h3 class=bad>/dev/net/tun is missing</h3><p>OpenVPN, the OpenVPN server and proxies need TUN support. Try <code>modprobe tun</code>; if that fails, your kernel was built without TUN.</p></div>`:''}${S.errors.length?`<div class=card><h3 class=bad>Errors</h3>${S.errors.map(e=>`<pre>${esc(e)}</pre>`).join('')}</div>`:''}
<div class=card><h3>VPN tunnels</h3><table><tr><th>Name<th>Interface<th>State</tr>${S.vpn.map(v=>`<tr><td>${v.name}<td>${v.iface}<td>${st(v.up)}`).join('')||'<tr><td class=mut>none configured'}</table>
<p class=mut>Services: ${Object.entries(S.services).map(([k,v])=>`${k}: ${v}`).join(' · ')}</p></div>
<div class=card><h3>Interfaces</h3><table><tr><th>Name<th>State<th>IPv4</tr>${S.ifaces.map(i=>`<tr><td>${esc(i.name)}<td>${esc(i.state)}<td>${esc(i.addrs.join(', '))}`).join('')}</table></div>
<div class=card><h3>Kernel routes (IPv4)</h3><table><tr><th>Destination<th>Via<th>Dev<th>Proto</tr>${S.kroutes.map(r=>`<tr><td>${esc(r.dst)}<td>${esc(r.via)}<td>${esc(r.dev)}<td>${esc(r.proto)}${r.proto=='77'?' (gwmanager)':''}`).join('')}</table></div>
<button class="b g" onclick=load()>Refresh</button>`}

function tpOpts(sel){return C.vpn_clients.map(v=>`<option value="vpn:${v.name}" ${sel==='vpn:'+v.name?'selected':''}>via ${v.type=='openvpn'||v.type=='l2tp'?'VPN':'proxy'}: ${v.name}</option>`).join('')+
`<option value=gateway ${sel==='gateway'?'selected':''}>via gateway IP</option><option value=blackhole ${sel==='blackhole'?'selected':''}>blackhole (drop)</option>`}
function routeRow(r,i){const sel=r.type=='vpn'?'vpn:'+r.vpn:r.type,s=(S.routes||[])[i]||'';
return `<tr><td><input type=checkbox class=en ${r.enabled!==false?'checked':''}><td><input class=cidr value="${esc(r.cidr)}" placeholder="10.0.0.0/8"><td><select class=tp>${tpOpts(sel)}</select>
<td><input class=gw value="${esc(r.gw||'')}" placeholder="gateway IP"><td><input class=mt type=number min=1 max=65535 value="${r.metric??1}" style="width:72px">
<td><input class=cm value="${esc(r.comment||'')}" placeholder="comment">
<td class="${s=='active'?'ok':s=='disabled'?'mut':'bad'}">${esc(s)}<td><button class="b d" onclick="this.closest('tr').remove()">✕</button>`}
function rRouting(){return `<div class=card><h3>Routing</h3><p class=mut>Send traffic for a destination through a VPN tunnel or a specific gateway. Longest prefix wins; <code>0.0.0.0/0</code> means everything (installed as two /1 routes, endpoints of your VPN servers are kept on the normal uplink). Everything not listed uses the system default route. <b>Distance</b> (1-65535, lower wins) lets you list the same destination more than once for failover: e.g. VPN A at 10, VPN B at 20. If a tunnel is down its rule is skipped and the next distance takes over (gateway rules have no health check).</p>
<table id=rt><tr><th><th>Destination CIDR<th>Send via<th>Gateway IP<th>Distance<th>Comment<th>Status<th></tr>${C.routes.map(routeRow).join('')}</table>
<button class="b g" onclick="addRoute()">+ Add rule</button><button class=b onclick="saveRoutes()">Save &amp; apply</button></div>`}
function addRoute(){$('#rt').insertAdjacentHTML('beforeend',routeRow({cidr:'',type:C.vpn_clients.length?'vpn':'gateway',vpn:(C.vpn_clients[0]||{}).name},-1))}
function saveRoutes(){const routes=[...document.querySelectorAll('#rt tr')].slice(1).map(tr=>{const t=tr.querySelector('.tp').value,q=s=>tr.querySelector(s);
 return{enabled:q('.en').checked,cidr:q('.cidr').value,type:t.startsWith('vpn:')?'vpn':t,vpn:t.startsWith('vpn:')?t.slice(4):undefined,gw:q('.gw').value,metric:q('.mt').value,comment:q('.cm').value}});put({routes})}

function rVpnc(){return `<div class=card><h3>Outbound VPNs &amp; proxies</h3><table><tr><th>Name<th>Type<th>Interface<th>State<th></tr>
${C.vpn_clients.map((v,i)=>`<tr><td>${v.name}<td>${v.type}<td>${({openvpn:'ovpn-',l2tp:'l2tp-'})[v.type]||'px-'}${v.name}<td>${st((S.vpn.find(x=>x.name==v.name)||{}).up)}
<td><button class="b g" onclick="showLog('${v.name}')">Log</button><button class="b g" onclick="togVpn(${i})">${v.enabled?'Disconnect':'Connect'}</button><button class="b d" onclick="delVpn(${i})">Delete</button>`).join('')||'<tr><td class=mut>none yet'}</table></div>
<div class=card id=lgc hidden><h3>Log</h3><pre id=lg style="white-space:pre-wrap;max-height:400px;overflow:auto;margin:0"></pre></div>
<div class=card><h3>Add VPN or proxy</h3><div class=row>${f('vn','Name (a-z0-9, max 8)','')}<div><label>Type</label><select id=vt onchange="vtc()"><option value=openvpn>OpenVPN</option><option value=l2tp>L2TP/IPsec (PSK)</option><option value=socks5>SOCKS5 proxy</option><option value=http>HTTP proxy</option><option value=shadowsocks>Shadowsocks</option></select></div></div>
<div id=fo><label>Paste .ovpn profile</label><textarea id=vo></textarea><div class=row>${f('vou','Username (optional)','')}${f('vop','Password','','password')}</div></div>
<div id=fl hidden><div class=row>${f('ls','Server host/IP','')}${f('lk','IPsec PSK','','password')}${f('lu','Username','')}${f('lp','Password','','password')}</div></div>
<div id=fp hidden><div class=row>${f('ph','Proxy host','')}${f('pp','Port','','number')}${f('pu','Username (SOCKS5/HTTP, optional)','')}${f('pw2','Password','','password')}
<div id=pcw hidden><label>Cipher</label><select id=pc><option>chacha20-ietf-poly1305</option><option>aes-256-gcm</option><option>aes-128-gcm</option></select></div></div></div>
<button class=b onclick=addVpn()>Add &amp; connect</button><p class=mut>Server-pushed routes/redirects are ignored on purpose. Use the Routing tab to decide what goes through each tunnel or proxy. Proxies run through tun2socks: SOCKS5 and Shadowsocks carry TCP and UDP, HTTP carries TCP only. Only IPs are proxied, so DNS lookups are not.</p></div>`}
async function showLog(n){try{const t=await api('log/'+encodeURIComponent(n));V('lgc').hidden=false;V('lg').textContent=t;V('lgc').scrollIntoView()}catch(e){if(e)msg(e.message,1)}}
function vtc(){const t=V('vt').value;V('fo').hidden=t!='openvpn';V('fl').hidden=t!='l2tp';V('fp').hidden=t=='openvpn'||t=='l2tp';V('pcw').hidden=t!='shadowsocks'}
function addVpn(){const t=V('vt').value,v={name:V('vn').value,type:t,enabled:true};
 if(t=='openvpn'){v.ovpn=V('vo').value;v.username=V('vou').value;v.password=V('vop').value}else if(t!='l2tp'){v.host=V('ph').value;v.port=V('pp').value;v.username=V('pu').value;v.password=V('pw2').value;v.cipher=V('pc').value}else{v.server=V('ls').value;v.psk=V('lk').value;v.username=V('lu').value;v.password=V('lp').value}
 put({vpn_clients:[...C.vpn_clients,v]})}
function togVpn(i){C.vpn_clients[i].enabled=!C.vpn_clients[i].enabled;put({vpn_clients:C.vpn_clients})}
function delVpn(i){const n=C.vpn_clients[i].name;if(!confirm('Delete '+n+'? Routes using it must be removed first.'))return;
 put({routes:C.routes.filter(r=>r.vpn!=n),vpn_clients:C.vpn_clients.filter((_,j)=>j!=i)})}

function rVpns(){const o=C.ovpn_server,l=C.l2tp_server;return `<div class=card><h3>OpenVPN server</h3><div class=row>${chk('oe','Enabled',o.enabled)}${f('op','Port',o.port,'number')}
<div><label>Protocol</label><select id=opr><option ${o.proto=='udp'?'selected':''}>udp</option><option ${o.proto=='tcp'?'selected':''}>tcp</option></select></div>${f('os','Tunnel subnet',o.subnet)}</div>
<div class=row>${f('oh','Public host/IP (put in client profiles)',o.public_host)}${f('opu','Push routes (comma-sep CIDRs, e.g. your LAN)',o.push_routes.join(', '))}${f('od','Push DNS',o.dns)}${chk('orr','Redirect all client traffic',o.redirect)}</div>
<button class=b onclick=saveO()>Save &amp; apply</button>
<h3 style="margin-top:18px">Client profiles</h3><table>${o.clients.map(n=>`<tr><td>${esc(n)}<td><a style="color:var(--ac)" href="/api/ovpn/client/${encodeURIComponent(n)}">Download .ovpn</a><td><button class="b d" onclick="delO('${esc(n)}')">Delete</button>`).join('')||'<tr><td class=mut>none'}</table>
<div class=row>${f('on','New client name','')}<div><label>&nbsp;</label><button class=b onclick=addO()>Create profile</button></div></div></div>
<div class=card><h3>L2TP/IPsec server</h3><div class=row>${chk('le','Enabled',l.enabled)}${f('lpsk','IPsec PSK',l.psk,'password')}${f('lli','Server tunnel IP',l.local_ip)}${f('lpo','Client IP pool',l.pool)}${f('ld','DNS for clients',l.dns)}</div>
<label>Users (one <code>username:password</code> per line)</label><textarea id=lus>${esc(l.users.map(u=>u.username+':'+u.password).join('\n'))}</textarea>
<button class=b onclick=saveL()>Save &amp; apply</button><p class=mut>Manages /etc/ppp/chap-secrets. Allow UDP 500, 4500 and 1701 to this host (from the internet side).</p></div>`}
function saveO(){put({ovpn_server:{enabled:V('oe').checked,port:V('op').value,proto:V('opr').value,subnet:V('os').value,public_host:V('oh').value,
 push_routes:V('opu').value.split(',').map(s=>s.trim()).filter(Boolean),dns:V('od').value,redirect:V('orr').checked}})}
async function addO(){try{await api('ovpn/client','POST',{name:V('on').value});msg('Created');load()}catch(e){if(e)msg(e.message,1)}}
async function delO(n){if(confirm('Delete profile '+n+'?')){await api('ovpn/client/'+encodeURIComponent(n),'DELETE');load()}}
function saveL(){put({l2tp_server:{enabled:V('le').checked,psk:V('lpsk').value,local_ip:V('lli').value,pool:V('lpo').value,dns:V('ld').value,
 users:V('lus').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const i=s.indexOf(':');return{username:s.slice(0,i),password:s.slice(i+1)}})}})}

function rSet(){return `<div class=card><h3>NAT / LAN</h3>${f('lan','LAN interfaces (comma-separated, e.g. eth1)',C.lan_ifaces.join(', '))}${chk('nat','Masquerade LAN and VPN-server clients when leaving via any other interface',C.nat)}
<button class=b onclick="put({lan_ifaces:V('lan').value.split(',').map(s=>s.trim()).filter(Boolean),nat:V('nat').checked})">Save &amp; apply</button>
<p class=mut>IPv4 forwarding is always enabled. Interface IPs and the default route are managed by you (ifupdown/netplan/systemd-networkd), not by this tool.</p></div>
<div class=card><h3>Admin password</h3>${f('np','New password (min 8)','','password')}<button class=b onclick="api('password','POST',{password:V('np').value}).then(()=>msg('Changed')).catch(e=>e&&msg(e.message,1))">Change</button></div>`}
load();setInterval(()=>{if(!C)return;if(tab=='dash'){api('status').then(s=>S=s).catch(()=>{});loadM()}else if(tab=='status')api('status').then(s=>{S=s;if(tab=='status')draw()}).catch(()=>{})},5000);
</script></body></html>
